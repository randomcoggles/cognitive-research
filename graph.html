<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Graph · Atlas of Cognition</title>
  <link rel="stylesheet" href="styles.css">
  <script src="atlas.js" defer></script>
</head>
<body data-page="graph">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <div class="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main">
        <div class="content">
          <section class="section">
            <div class="section-header"><div>
              <p class="eyebrow">Knowledge graph</p>
              <h1>How the capabilities connect</h1>
              <p class="section-intro">Large nodes are domains and small nodes are capabilities. Curved lines are the connections recorded for each domain. Hover or focus a node to highlight its links; select it to open its page. <span id="graph-count"></span></p>
            </div></div>
            <div class="graph-wrap"><svg id="graph-svg" role="group" aria-label="Atlas knowledge graph"></svg></div>
          </section>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
